{{ $about := site.Data.about }}
{{ if $about }}
<div class="about-grid">
  {{ range $about }}
    <article class="about-card">
      <i class="{{ .icon }} about-card__icon"></i>
      <h3 class="about-card__title">{{ .title }}</h3>
      <p class="about-card__desc">{{ .description }}</p>
    </article>
  {{ end }}
</div>
{{ end }}
