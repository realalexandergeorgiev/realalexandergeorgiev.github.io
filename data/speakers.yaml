- name: "Jörn Schneeweisz"
  keynote: true
  photo: "/images/speakers/joernchen.png"
  role: "Principal Security Engineer, Gitlab"
  bio: "Jörn Schneeweisz is a Principal Security Engineer at GitLab who managed to turn a decade of breaking other people's broken Ruby on Rails code into a legitimate corporate career, because apparently, getting paid to tell companies how bad their security is qualifies as a real job."
  linkedin: "https://www.linkedin.com/in/joern-schneeweisz-b5a4511b1/"
  talk: "Keynote"
- name: "Christian Biehler"
  photo: "/images/speakers/christianbiehler.jpg"
  role: "Managing Director, bi-sec GmbH"
  bio: "With over a decade of experience in the field, Christian Biehler is a seasoned IT security expert who combines the perspectives of a hacker, penetration tester, consultant, and trainer. His technical focus lies in securing Windows infrastructures and the Microsoft Cloud stack, including Entra ID, Azure, and M365. Christian holds a Master's degree in IT Security and the CISSP certification. He has successfully delivered over 300 projects across diverse sectors, establishing deep expertise in security architecture, risk management, and penetration testing for web, mobile, and operating systems. Since 2019, Christian has been the Managing Director of bi-sec GmbH, leading a firm dedicated to expert consulting, rigorous penetration testing, and specialized security training."
  talk: "Pentesting in the age of AI - where are we?"
  linkedin: "https://www.linkedin.com/in/christian-biehler-81146844"
- name: "Maurice Fielenbach"
  photo: "/images/speakers/MauriceFielenbach.jpg"
  role: "Founder, Hexastrike Cybersecurity"
  bio: "With over 10 years of experience in cybersecurity, Maurice Fielenbach started on the offensive side before moving into defensive security. He has worked hundreds of cyber investigations, including major ransomware and APT cases across industries affecting millions of people. Among them was one of the largest ransomware incidents in German history, targeting a communal IT service provider and disrupting public infrastructure at scale. Today he focuses primarily on threat intelligence and malware analysis. He is the founder of Hexastrike Cybersecurity, where he trains blue teams in digital forensics, malware analysis, and threat hunting through hands-on, scenario-driven sessions built from real incidents. His research is regularly featured in leading cybersecurity publications and cited by industry peers. He speaks at security conferences and contributes open-source tooling and detection content used by security teams worldwide."
  talk: "What Windows 11 Remembers (And Most Investigators Miss)"
- name: "Tim Schmidt"
  photo: "/images/speakers/TimSchmidt.jpg"
  role: "IT Security Researcher & Penetration Tester"
  bio: "Tim Schmidt is an IT security researcher and penetration tester with over a decade of experience in competitive Capture The Flag (CTF) environments. While his core expertise lies in web and application penetration testing, his technical background also spans IoT and embedded reverse engineering and smart contract audits. An avid builder, Tim frequently develops software projects and custom IoT appliances from scratch in his free time. As an educator, he has delivered specialized trainings on modern authentication technologies and cryptographic attacks for corporate clients in Germany and at international security conferences, such as HITB Amsterdam."
  talk: "Hacking Consumer Drones: From Flash Dumping to Root Exploits"
- name: "Kolja Grassmann"
  photo: "/images/speakers/KoljaGrassmann.png"
  role: "Security Researcher, Neodyme"
  bio: "Kolja is a Security Researcher and Trainer at Neodyme. He specializes in Windows and Active Directory security. He has found vulnerabilities in widely used security products and has extensive exploit development, pentesting, and red teaming experience."
  talk: "Keyless Entry: Hacking SwitchBot Smartlocks"
- name: "Stephan Berger"
  photo: "/images/speakers/Berger_Stephan.jpg"
  role: "Head of Investigations, InfoGuard"
  bio: "Stephan Berger is the Head of Investigations for an Incident Response team at InfoGuard, a Swiss-based cybersecurity firm. With over a decade of experience investigating complex network compromises, he specializes in the technical intersection of offensive tradecraft and defensive forensics. Stephan is the author of the DFIR.ch technical blog and is a regular speaker at international security conferences, including FIRST, Troopers, and hack.lu. He holds a Bachelor's degree in Computer Science and a Master's degree in Engineering and is the founder of Malmium, a specialized technical training provider."
  talk: "Deconstructing Modern macOS Initial Access Vectors"
  linkedin: "https://www.linkedin.com/in/stephan-berger-59575a20a/"
- name: "Aaron Jewitt"
  role: "Principal Detection Engineer, Elastic"
  bio: "Aaron Jewitt is a Principal Detection Engineer on the Elastic Infosec team. A 20-year security veteran with 10 years of offensive experience at the NSA and 10 years of experience defending networks, he specializes in detection engineering and high-velocity automation. Aaron is currently leading internal efforts to integrate AI agents into daily SecOps. Aaron lives in Germany and is a two-time speaker at BSides Frankfurt, dedicated to sharing practical, real-world lessons from the front lines of defense."
  talk: "Lessons learned while building an Agentic SOC: The good, the bad, and the scary."
  linkedin: "https://www.linkedin.com/in/aaron-jewitt/"
- name: "Georg Heise"
  photo: "/images/speakers/georgheise.png"
  role: "Senior Offensive Security Consultant and Security Researcher, Lufthansa Industry Solution"
  bio: "Georg Heise is a Senior Offensive Security Consultant at Lufthansa Industry Solutions, specializing in enterprise offensive security, identity security, and AI-driven research. With a decade of experience leading security assessments for Fortune 500 companies and critical infrastructure, he also advises an international logistics group on information security and digitalization. His work bridges offensive security and AI-powered tooling, aiming to help organizations prepare for autonomous attackers."
  talk: "Welcome to Hybrid Hell - Breaking Enterprise Identity beyond Active Directory"
  linkedin: "https://www.linkedin.com/in/georgpheheise/"
- name: "Ben Stuart"
  photo: "/images/speakers/BenStuart.png"
  role: "Owner of Wisp Security GmbH"
  bio: "Ben Stuart is an offensive security consultant based in Wiesbaden, Germany, and a Rustacean since 1.0, back when he was doing embedded and microcontroller work at university, long before it was a fashionable choice for offensive tooling. He holds the OSCE3 (OSCP, OSEP, OSWE, OSED) and runs his own company, Wisp Security GmbH, doing penetration testing and offensive security development"
  workshop: "Rustacean Introduction to Shellcoding"
  linkedin: "https://www.linkedin.com/in/ben-stuart-pentester/"
- name: "Ethan Bowen"
  photo: "/images/speakers/Ethan_Bowen.webp"
  role: "Security Solutions Architect at NVISO"
  bio: "Ethan Bowen is a Security Solutions Architect at NVISO, where he helps organizations solve complex SOC challenges. He brings more than 10 years of blue team experience across consulting, financial services, federal government, and technology sectors, with a focus on detection engineering, incident response, threat hunting, and Microsoft security technologies. Before joining NVISO, Ethan worked at Deutsche Bank, the U.S. Cybersecurity and Infrastructure Security Agency (CISA), Microsoft, Pacific Northwest National Laboratory, and the U.S. Department of Defense. Ethan holds a Bachelor of Science in Cybersecurity from Penn State University. He also holds multiple industry certifications, including GREM, GCFA, CISSP, and multiple Microsoft certifications. Outside of work, Ethan enjoys running and playing board games."
  workshop: "Defending Microsoft Entra ID: Common Attacks, Tokens, and Response Planning"
- name: "Alessio Di Santo"
  photo: "/images/speakers/AlessioDiSanto.png"
  role: "Senior Information Security Specialist @ Deutsche Boerse & Ph.D. Student @ University of L'Aquila"
  bio: "Alessio Di Santo is a Cybersecurity Professional and Doctoral Candidate with a focus on cryptography and digital forensics. He holds both a Bachelor's Degree in Information Engineering and a Master's Degree in Computer and Automation Engineering from the Università degli Studi dell'Aquila, where his research concentrated on Cryptographic Fairness and Forensic Acquisition for IT/OT systems, respectively. Since 2020, Alessio has worked in the cybersecurity industry as a Cyber Threat Intelligence Analyst, Incident Responder, and Malware Analyst. He is currently completing his Ph.D. under the supervision of Prof. Dajana Cassioli (co-tutor Walter Tiberti) and working as a Senior Information Security Specialist at Deutsche Boerse."
  workshop: "Cryptography: An Evolutionary Tale"
- name: "Paul McCarty"
  photo: "/images/speakers/PaulMcCarty.png"
  role: "Founder and Head of Research at OpenSourceMalware"
  bio: "Paul is the founder and maintainer of OpenSourceMalware.com the world's only community threat intel platform for software supply chain threats. He founded SecureStack in 2017 and SourceCodeRED in 2023. Paul is a DevSecOps veteran who focuses on software supply chain research, offensive training, and engagements, including deep work in the NPM ecosystem. He's worked with organizations including NASA, Boeing, John Deere, the US military, and the Australian government, and is an active open-source contributor currently writing \"Hacking NPM.\" He also likes to snowboard with his family and throw sick cab 360's off his toes!"
  workshop: "Hunting Supply Chain Attacks: Hands-on Anaysis of npm, PyPI, and VS Code Threats"
  linkedin: "https://www.linkedin.com/in/mccartypaul/"
- name: "Marius Genheimer"
  photo: "/images/speakers/GenheimerMarius.webp"
  role: "DFIR Specialist and Threat Researcher with the SECUINFRA"
  bio: "Marius Genheimer is a DFIR Specialist and Threat Researcher with the SECUINFRA Falcon Team. He specializes in malware analysis and defensive security training."
  workshop: "A phishing trip with Fancy Bear - Let's analyze APT malware together!"
  linkedin: "https://www.linkedin.com/in/marius-genheimer/"
- name: "Nico Leidecker"
  role: "Offensive Security Teamlead, NVISO"
  bio: "Nico Leidecker leads NVISO's offensive security team. With more than 20 years of hands-on experience in security testing, red teaming, and adversarial simulation, he specializes in designing tailored engagements that help organizations assess and strengthen their resilience against targeted threats. His work combines realistic attacker emulation with practical insights into how organizations can improve their defensive posture. He and his team conduct multiple red team engagements each year, often including physical security attack vectors."
  workshop: "Introduction to Physical Security Testing"
- name: "Harris Nuhanović"
  role: "Red Team Operator on NVISO’s ARES team"
  photo: "/images/speakers/harrisnuhanovic.webp"
  bio: "Harris Nuhanović is a Red Team Operator on NVISO’s ARES team, specializing in physical intrusion testing and adversary emulation. He regularly conducts red team engagements involving physical security attack vectors, from lock picking, access control and door bypasses to badge cloning."
  workshop: "Introduction to Physical Security Testing"
- name: "Jakob Steeg"
  role: "Security consultant and penetration tester at usd AG"
  photo: "/images/speakers/jakobsteeg.jpg"
  bio: "Jakob Steeg is a security consultant and penetration tester at usd AG with several years of experience in planning and executing penetration tests across web applications, APIs, cloud environments, Kubernetes, Windows/Active Directory, mobile platforms, and native/thick client applications. He specializes in the security assessment of desktop clients and proprietary or binary protocols, applying his strong software development background to build custom testing tools and analyze complex systems. His expertise includes cryptographic mechanisms, secure software development, public key infrastructures, and modern network architectures. Jakob holds a Master’s degree in IT Security from TU Darmstadt, is OSCP and OSWE certified, and has published multiple CVE-listed vulnerabilities."
  workshop: "Desktop Application Pentesting 101 for Security Professionals"
- name: "Tim Kranz"
  role: "Undercover at usd AG"
  workshop: "Desktop Application Pentesting 101 for Security Professionals"
- name: "Gabriella Lanziani"
  photo: "/images/speakers/GabriellaLanziani.jpeg"
  workshop: "Cryptography: An Evolutionary Tale"
- name: "Dajana Cassioli"
  photo: "/images/speakers/DajanaCassioli.png"
  workshop: "Cryptography: An Evolutionary Tale"
  bio: "Dajana Cassioli is an Associate Professor of Telecommunications Engineering at the University of L’Aquila, Italy, and a Senior IEEE Member. Her research focuses on wireless communications, 5G/B5G networks, and cybersecurity, with over 100 publications in top international journals and conferences. She has led multiple IEEE technical groups, coordinated the CINI National Laboratory of Cybersecurity, and received prestigious ERC grants. Additionally, she co-founded and led a university spin-off, Smartly, and has held editorial roles for several renowned journals."
