- question: "Can I bring my own food to the conference?"
  answer: "Yes, sure. We think we have enough, but feel free to bring your own."

- question: "Is there parking available?"
  answer: "There are some non-free public parking areas nearby, but not many. We strongly recommend coming by public transportation if possible - the venue is well connected via S-Bahn and U-Bahn."

- question: "Will the talks be recorded?"
  answer: "We aim to record most of the main-track talks and publish them after the conference, subject to speaker consent. Workshops and some community sessions are typically not recorded."

- question: "Is the venue accessible?"
  answer: "Yes. Goethe University Frankfurt's Westend Campus is fully wheelchair-accessible. If you have specific accessibility needs, please email info@bsidesfrankfurt.org and we'll make sure things are arranged ahead of time."

- question: "What is the dress code?"
  answer: "Come as you are. BSidesFrankfurt is deliberately informal - most attendees wear jeans and a t-shirt. Dress for comfort."

- question: "Is there a Code of Conduct?"
  answer: "Yes. Every attendee, speaker, sponsor, and volunteer is expected to follow our Code of Conduct, which you can read on the [Code of Conduct page](/code-of-conduct/)."

- question: "Is the event in English or German?"
  answer: "All main-track talks and the official program are in English. You're welcome to speak German in conversations and hallway discussions - the community is pan-European and German is common."

