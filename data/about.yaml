- id: community
  icon: "fas fa-users"
  title: Community
  description: >-
    BSidesFrankfurt is organized by the community, for the community. Our goal is
    to provide a platform for knowledge sharing, networking, and collaboration
    among information security professionals, researchers, and enthusiasts. We
    believe in an open and inclusive environment where everyone is welcome to
    participate and contribute.
- id: technical
  icon: "fas fa-terminal"
  title: Technical
  description: >-
    We focus solely on technical content. You won't find any vendor pitches or
    marketing presentations at BSidesFrankfurt. Our talks and workshops are
    selected based on their technical merit and relevance to the security
    community. We cover a wide range of topics, including offensive security,
    defensive strategies, forensics, reverse engineering, and more.
